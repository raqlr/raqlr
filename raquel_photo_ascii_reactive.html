
<style>
#wrap{background:#000;border-radius:var(--border-radius-lg);overflow:hidden;position:relative}
#cv{display:block;width:100%;cursor:crosshair}
#status{color:rgba(255,255,255,.3);font-size:11px;font-family:monospace;padding:6px 12px;background:#000;text-align:center;letter-spacing:.1em}
.ctrls{display:flex;gap:8px;padding:8px 10px;background:#000;flex-wrap:wrap;align-items:center}
.ctrls label{font-size:11px;color:rgba(255,255,255,.35);font-family:monospace;white-space:nowrap;min-width:44px}
.ctrls input[type=range]{flex:1;min-width:60px;accent-color:#64ffda}
.ctrls span{font-size:11px;color:rgba(255,255,255,.5);font-family:monospace;min-width:28px;text-align:right}
.ctrls button{font-size:10px;letter-spacing:.12em;color:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.12);background:transparent;padding:4px 10px;cursor:pointer;font-family:monospace}
.ctrls button:hover{color:#fff;border-color:rgba(255,255,255,.4)}
.ctrls button.on{color:#64ffda;border-color:#64ffda}
.swatches{display:flex;gap:4px;align-items:center}
.sw{width:16px;height:16px;border-radius:3px;cursor:pointer;border:1.5px solid transparent}
.sw.active{border-color:#fff}
</style>

<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="status">loading photo...</div>
  <div class="ctrls">
    <label>force</label>
    <input type="range" id="sl-force" min="20" max="220" value="90" step="1">
    <span id="vf">90</span>
    <label>radius</label>
    <input type="range" id="sl-rad" min="20" max="130" value="65" step="1">
    <span id="vr">65</span>
    <label>friction</label>
    <input type="range" id="sl-fric" min="70" max="98" value="87" step="1">
    <span id="vfr">0.87</span>
    <div class="swatches" id="swatches">
      <div class="sw active" data-c="#64ffda" style="background:#64ffda" title="teal"></div>
      <div class="sw" data-c="#fff" style="background:#fff" title="white"></div>
      <div class="sw" data-c="#a8b2d1" style="background:#a8b2d1" title="slate"></div>
      <div class="sw" data-c="#f5a623" style="background:#f5a623" title="amber"></div>
      <div class="sw" data-c="#ff79c6" style="background:#ff79c6" title="pink"></div>
    </div>
    <button id="btn-reset">reset</button>
  </div>
</div>

const CHARS = " .:-=+*#%@".split("");
const canvas = document.getElementById("cv");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");

let W=0, H=0, particles=[], mouse={x:-9999,y:-9999};
let FORCE=90, RADIUS=65, FRICTION=0.87;
let COLOR="#64ffda";
let ready=false;

function buildParticles(img){
  const scale = window.devicePixelRatio||1;
  const cw = canvas.offsetWidth, ch = Math.round(cw * img.height / img.width);
  canvas.width = cw * scale;
  canvas.height = ch * scale;
  canvas.style.height = ch + "px";
  W = canvas.width; H = canvas.height;

  const off = document.createElement("canvas");
  const maxW = 420, maxH = 420;
  let dw = img.width, dh = img.height;
  if(dw > maxW){ dh = Math.round(dh*maxW/dw); dw = maxW; }
  if(dh > maxH){ dw = Math.round(dw*maxH/dh); dh = maxH; }
  off.width = dw; off.height = dh;
  const oc = off.getContext("2d");
  oc.drawImage(img, 0, 0, dw, dh);
  const {data} = oc.getImageData(0, 0, dw, dh);

  particles = [];
  const fs = 7*scale, cg = fs*0.7, rg = fs*1.1;
  const scx = W/dw, scy = H/dh;

  for(let y=0;y<dh;y+=rg/scy){
    for(let x=0;x<dw;x+=cg/scx){
      const i = (Math.floor(y)*dw + Math.floor(x))*4;
      if(data[i+3]<60) continue;
      const r=data[i], g=data[i+1], b=data[i+2];
      const bright = (r+g+b)/(3*255);
      if(bright>0.88) continue;
      const ci = Math.min(CHARS.length-1, Math.floor(bright*(CHARS.length-1)));
      const px = x*scx, py = y*scy + rg;
      particles.push({
        x:px, y:py, cx:px, cy:py, vx:0, vy:0,
        char:CHARS[ci],
        alpha: Math.max(0.15, 0.35 + (1-bright)*0.65)
      });
    }
  }
  statusEl.textContent = particles.length.toLocaleString() + " particles — move mouse over portrait";
  ready = true;
}

function loop(){
  ctx.clearRect(0,0,W,H);
  ctx.font = `${7*(window.devicePixelRatio||1)}px monospace`;
  ctx.textBaseline = "top";
  const dpr = window.devicePixelRatio||1;
  const r = canvas.getBoundingClientRect();
  const mx = (mouse.x - r.left) * (W / r.width);
  const my = (mouse.y - r.top)  * (H / r.height);

  for(const p of particles){
    const dx = p.cx - mx, dy = p.cy - my;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const rscaled = RADIUS * dpr;
    if(dist < rscaled && dist > 0.5){
      const f = (FORCE * dpr) / dist;
      p.vx += (dx/dist)*f;
      p.vy += (dy/dist)*f;
    }
    p.vx += (p.x - p.cx)*0.08;
    p.vy += (p.y - p.cy)*0.08;
    p.vx *= FRICTION;
    p.vy *= FRICTION;
    p.cx += p.vx;
    p.cy += p.vy;

    const t = dist < 1 ? 0 : Math.max(0, 1 - dist/rscaled);
    ctx.globalAlpha = p.alpha;
    if(t > 0.02){
      const hex = COLOR;
      const r2 = parseInt(hex.slice(1,3)||"64",16);
      const g2 = parseInt(hex.slice(3,5)||"ff",16);
      const b2 = parseInt(hex.slice(5,7)||"da",16);
      const mix = t*0.7;
      ctx.fillStyle = `rgb(${Math.round(r2*mix+200*(1-mix))},${Math.round(g2*mix+200*(1-mix))},${Math.round(b2*mix+200*(1-mix))})`;
    } else {
      ctx.fillStyle = COLOR;
    }
    ctx.fillText(p.char, p.cx, p.cy);
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(loop);
}

canvas.addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
canvas.addEventListener("touchmove", e => {
  e.preventDefault();
  mouse.x = e.touches[0].clientX;
  mouse.y = e.touches[0].clientY;
}, {passive:false});
canvas.addEventListener("mouseleave", () => { mouse.x = -9999; mouse.y = -9999; });
canvas.addEventListener("touchend", () => { mouse.x = -9999; mouse.y = -9999; });

function hookSlider(id, outId, cb){
  const sl = document.getElementById(id);
  const out = document.getElementById(outId);
  sl.addEventListener("input", () => { cb(+sl.value); out.textContent = sl.value; });
}
hookSlider("sl-force","vf", v => FORCE=v);
hookSlider("sl-rad","vr", v => RADIUS=v);
document.getElementById("sl-fric").addEventListener("input", function(){
  FRICTION = +this.value/100;
  document.getElementById("vfr").textContent = FRICTION.toFixed(2);
});

document.querySelectorAll(".sw").forEach(sw => {
  sw.addEventListener("click", function(){
    document.querySelectorAll(".sw").forEach(s=>s.classList.remove("active"));
    this.classList.add("active");
    COLOR = this.dataset.c;
  });
});

document.getElementById("btn-reset").addEventListener("click", () => {
  particles.forEach(p => { p.cx=p.x; p.cy=p.y; p.vx=0; p.vy=0; });
});

const img = new Image();
img.onload = () => {
  buildParticles(img);
  loop();
};
img.onerror = () => { statusEl.textContent = "error loading image"; };
img.src = "data:image/jpeg;base64," + IMG_B64;

window.addEventListener("resize", () => {
  if(ready) buildParticles(img);
});
